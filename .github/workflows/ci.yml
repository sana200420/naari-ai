name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed. Remove it and rotate the keys."
            exit 1
          fi
          echo "No .env in the repo."

      - run: pip install -r requirements.txt
      - run: pytest retrieval/
      - run: pytest api/
      - run: python eval/run_danger_gate_eval.py --ci
      # Precision counterpart to the recall check above: fails the build if
      # the danger gate starts crying wolf on benign questions. See
      # eval/run_negative_set_eval.py for why this matters as much as recall.
      - run: python eval/run_negative_set_eval.py --ci